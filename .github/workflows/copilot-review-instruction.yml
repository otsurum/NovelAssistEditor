name: Add Copilot Instruction to PR

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  append-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Append message to PR description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ADDITION: |
            
            ## Copilotへのメッセージ
            日本語でレビューして
        run: |
          # 現在のPRの本文を取得
          CURRENT_BODY=$(gh pr view "$PR_URL" --json body --template '{{.body}}')
          
          # 既にメッセージが含まれていないか確認して追記
          if [[ "$CURRENT_BODY" != *"$ADDITION"* ]]; then
            gh pr edit "$PR_URL" --body "$CURRENT_BODY$ADDITION"
          fi
